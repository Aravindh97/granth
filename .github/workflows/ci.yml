name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: granth, POSTGRES_PASSWORD: ci-only-password, POSTGRES_DB: granth}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U granth" --health-interval 5s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.26"}
      - run: go vet ./...
      - run: go test -race ./...
      - run: go test -tags integration ./internal/store
        env: {DATABASE_URL: "postgres://granth:ci-only-password@localhost:5432/granth?sslmode=disable"}
      - run: OCR=none go run ./cmd/granth eval
